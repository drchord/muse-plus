name: MusePlus
options:
  bundleIdPrefix: com.drchord
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "${CURRENT_PROJECT_VERSION:-1}"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Manual
    PRODUCT_BUNDLE_IDENTIFIER: com.drchord.museplus

targets:
  MusePlus:
    type: application
    platform: iOS
    sources:
      - path: MusePlus
    resources:
      - path: MusePlus/Resources
        optional: true
    info:
      path: MusePlus/Info.plist
      properties:
        CFBundleDisplayName: Muse Plus
        UIBackgroundModes:
          - bluetooth-central
          - audio
        NSBluetoothAlwaysUsageDescription: Muse Plus connects to your Muse S headband to read EEG data during meditation sessions.
        NSMicrophoneUsageDescription: Muse Plus does not record audio; this permission is required by AVAudioSession only.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiredDeviceCapabilities:
          - bluetooth-le
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - muse-monitor
    dependencies:
      - framework: Frameworks/Muse.xcframework
        embed: true
    settings:
      base:
        FRAMEWORK_SEARCH_PATHS:
          - $(PROJECT_DIR)/Frameworks
        ENABLE_BITCODE: NO

  MusePlusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MusePlusTests
    dependencies:
      - target: MusePlus
