name: iOS Build & TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT: MusePlus.xcodeproj
  SCHEME: MusePlus
  CONFIGURATION: Release

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode
        run: |
          ls /Applications/ | grep -i xcode
          XCODE_PATH=$(ls -d /Applications/Xcode*.app /Applications/Xcode_*.app 2>/dev/null \
            | sort -V | tail -1)
          echo "Selecting: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Generate app icons
        run: |
          python3 - <<'EOF'
          import struct, zlib, os
          def make_png(size, r=74, g=144, b=226):
              def chunk(tag, data):
                  crc = zlib.crc32(tag + data) & 0xffffffff
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', crc)
              raw = b''.join(b'\x00' + bytes([r, g, b] * size) for _ in range(size))
              ihdr = struct.pack('>IIBBBBB', size, size, 8, 2, 0, 0, 0)
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
          dest = 'MusePlus/Resources/Assets.xcassets/AppIcon.appiconset'
          os.makedirs(dest, exist_ok=True)
          for s in [40, 58, 60, 80, 87, 120, 180, 1024]:
              with open(f'{dest}/AppIcon-{s}.png', 'wb') as f:
                  f.write(make_png(s))
          print('Icons generated')
          EOF

      - name: Set build number
        run: |
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleVersion ${{ github.run_number }}" \
            MusePlus/Info.plist

      - name: Import distribution certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          set -e
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_P12" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH" || true
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Install provisioning profile
        env:
          APPSTORE_PROVISIONING_PROFILE: ${{ secrets.APPSTORE_PROVISIONING_PROFILE }}
        run: |
          PP_PATH=$RUNNER_TEMP/MusePlus_AppStore.mobileprovision
          echo "$APPSTORE_PROVISIONING_PROFILE" | base64 --decode > "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Setup ASC API key
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_9V47M72GKG.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_9V47M72GKG.p8

      - name: Build and archive
        env:
          DEVELOPMENT_TEAM: YZN764NT86
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -archivePath build/MusePlus.xcarchive \
            DEVELOPMENT_TEAM=YZN764NT86 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="a33ca022-44cc-4431-92a2-cc5b5100db3a" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            2>&1 | tee build/xcodebuild.log | xcpretty || exit ${PIPESTATUS[0]}

      - name: Export and upload to TestFlight
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/MusePlus.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_9V47M72GKG.p8 \
            -authenticationKeyID 9V47M72GKG \
            -authenticationKeyIssuerID 620b8c6b-545b-4fb4-8b7f-4b527a671243

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            build/MusePlus.xcarchive/Logs/
            build/xcodebuild.log
